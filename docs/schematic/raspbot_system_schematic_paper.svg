<text x="676" y="818" class="box-text">ALSA arecord</text>
<text x="676" y="843" class="box-text">16 kHz / mono / raw PCM</text><rect x="1075" y="735" width="280" height="140" rx="8" ry="8" fill="#fdf2f8" stroke="#222" stroke-width="2"/>
<rect x="1075" y="735" width="280" height="34" rx="8" ry="8" fill="#db2777" stroke="#222" stroke-width="0"/>
