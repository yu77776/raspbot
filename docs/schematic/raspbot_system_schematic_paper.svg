<text x="800.0" y="523" text-anchor="middle" class="box-title" fill="#fff">电源与地线说明</text>
<text x="601" y="558" class="box-text">5V: 超声波、电机/舵机扩展板、部分传感器模块</text>
<text x="601" y="583" class="box-text">3.3V: I2C 逻辑/部分低压模块</text>
<text x="601" y="608" class="box-text">GND: 所有模块共地</text>
<text x="601" y="633" class="box-text">论文图重点表达接口关系，实际供电按模块规格核对</text><text x="80" y="980" text-anchor="start" class="foot" fill="#444">代码依据：raspbot_remote/modules/ultrasonic.py, infrared.py, buzzer.py, camera.py, mic_stream.py, audio.py, pcf8591.py, mpu6050.py；driver/YB_Pcb_Car.py</text><text x="80" y="1008" text-anchor="start" class="foot" fill="#444">生成日期：2026-05-17；适用场景：毕业论文系统硬件组成/外设接口说明</text>
