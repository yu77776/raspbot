  <text x="800.0" y="55" text-anchor="middle" class="title" fill="#111">Raspbot 树莓派外设连接系统原理图</text><text x="800.0" y="88" text-anchor="middle" class="subtitle" fill="#111">论文用系统级示意：按 GPIO / I2C / CSI / USB 分类，非打板级封装图</text><rect x="585" y="150" width="430" height="300" rx="8" ry="8" fill="#f8fafc" stroke="#222" stroke-width="2"/>
<rect x="585" y="150" width="430" height="34" rx="8" ry="8" fill="#0f766e" stroke="#222" stroke-width="0"/>
<text x="800.0" y="173" text-anchor="middle" class="box-title" fill="#fff">Raspberry Pi 4B / 40Pin 主控</text>
<text x="601" y="208" class="box-text">BOARD 编号模式：GPIO.setmode(GPIO.BOARD)</text>
<text x="601" y="233" class="box-text">I2C1: BOARD 3=SDA/GPIO2, BOARD 5=SCL/GPIO3</text>
<text x="601" y="258" class="box-text">CSI 摄像头接口：Picamera2 / libcamera</text>
<text x="601" y="283" class="box-text">USB: 麦克风与双扬声器</text>
<text x="601" y="308" class="box-text">WebSocket: 视频/环境/控制数据</text><rect x="80" y="170" width="360" height="115" rx="8" ry="8" fill="#eff6ff" stroke="#222" stroke-width="2"/>
<rect x="80" y="170" width="360" height="34" rx="8" ry="8" fill="#2563eb" stroke="#222" stroke-width="0"/>
<text x="260.0" y="193" text-anchor="middle" class="box-title" fill="#fff">HC-SR04 超声波模块</text>
<text x="96" y="228" class="box-text">TRIG -&gt; BOARD16 / BCM23 / OUT</text>
<text x="96" y="253" class="box-text">ECHO -&gt; BOARD18 / BCM24 / IN</text>
<text x="96" y="278" class="box-text">VCC=5V, GND=GND</text><rect x="80" y="330" width="360" height="140" rx="8" ry="8" fill="#eff6ff" stroke="#222" stroke-width="2"/>
<rect x="80" y="330" width="360" height="34" rx="8" ry="8" fill="#2563eb" stroke="#222" stroke-width="0"/>
<text x="260.0" y="353" text-anchor="middle" class="box-title" fill="#fff">四路红外循迹模块</text>
<text x="96" y="388" class="box-text">TRACK1 -&gt; BOARD7  / BCM4  / IN</text>
<text x="96" y="413" class="box-text">TRACK2 -&gt; BOARD11 / BCM17 / IN</text>
<text x="96" y="438" class="box-text">TRACK3 -&gt; BOARD13 / BCM27 / IN</text>
<text x="96" y="463" class="box-text">TRACK4 -&gt; BOARD15 / BCM22 / IN</text><rect x="80" y="520" width="360" height="95" rx="8" ry="8" fill="#eff6ff" stroke="#222" stroke-width="2"/>
<rect x="80" y="520" width="360" height="34" rx="8" ry="8" fill="#2563eb" stroke="#222" stroke-width="0"/>
<text x="260.0" y="543" text-anchor="middle" class="box-title" fill="#fff">蜂鸣器</text>
<text x="96" y="578" class="box-text">BUZZER_PWM -&gt; BOARD32 / BCM12 / PWM OUT</text>
<text x="96" y="603" class="box-text">GND -&gt; GND</text><rect x="1160" y="135" width="350" height="115" rx="8" ry="8" fill="#f0fdf4" stroke="#222" stroke-width="2"/>
<rect x="1160" y="135" width="350" height="34" rx="8" ry="8" fill="#16a34a" stroke="#222" stroke-width="0"/>
<text x="1335.0" y="158" text-anchor="middle" class="box-title" fill="#fff">Yahboom 电机/舵机扩展板</text>
<text x="1176" y="193" class="box-text">I2C 地址: 0x16</text>
<text x="1176" y="218" class="box-text">电机驱动与舵机 PWM 由扩展板输出</text>
<text x="1176" y="243" class="box-text">树莓派只通过 I2C 发命令</text><rect x="1160" y="285" width="350" height="95" rx="8" ry="8" fill="#f0fdf4" stroke="#222" stroke-width="2"/>
<rect x="1160" y="285" width="350" height="34" rx="8" ry="8" fill="#16a34a" stroke="#222" stroke-width="0"/>
<text x="1335.0" y="308" text-anchor="middle" class="box-title" fill="#fff">OLED SSD1306 显示屏</text>
<text x="1176" y="343" class="box-text">I2C 地址: 0x3C</text>
<text x="1176" y="368" class="box-text">128x32 表情/状态显示</text><rect x="1160" y="415" width="350" height="140" rx="8" ry="8" fill="#f0fdf4" stroke="#222" stroke-width="2"/>
<rect x="1160" y="415" width="350" height="34" rx="8" ry="8" fill="#16a34a" stroke="#222" stroke-width="0"/>
<text x="1335.0" y="438" text-anchor="middle" class="box-title" fill="#fff">PCF8591 ADC 模块</text>
<text x="1176" y="473" class="box-text">I2C 地址: 0x48</text>
<text x="1176" y="498" class="box-text">AIN0: 光照</text>
<text x="1176" y="523" class="box-text">AIN1: 温度 NTC</text>
<text x="1176" y="548" class="box-text">AIN2: 烟雾/MQ-2</text>
<text x="1176" y="573" class="box-text">AIN3: 音量旋钮</text><rect x="1160" y="595" width="350" height="95" rx="8" ry="8" fill="#f0fdf4" stroke="#222" stroke-width="2"/>
<rect x="1160" y="595" width="350" height="34" rx="8" ry="8" fill="#16a34a" stroke="#222" stroke-width="0"/>
<text x="1335.0" y="618" text-anchor="middle" class="box-title" fill="#fff">MPU6050 姿态传感器</text>
<text x="1176" y="653" class="box-text">I2C 地址: 0x68</text>
<text x="1176" y="678" class="box-text">三轴加速度/陀螺仪</text><rect x="245" y="735" width="280" height="140" rx="8" ry="8" fill="#fff7ed" stroke="#222" stroke-width="2"/>
<rect x="245" y="735" width="280" height="34" rx="8" ry="8" fill="#ea580c" stroke="#222" stroke-width="0"/>
<text x="385.0" y="758" text-anchor="middle" class="box-title" fill="#fff">CSI 摄像头</text>
<text x="261" y="793" class="box-text">专用 CSI 排线接口</text>
<text x="261" y="818" class="box-text">Picamera2 采集 JPEG 视频流</text>
<text x="261" y="843" class="box-text">不占普通 GPIO</text><rect x="660" y="735" width="280" height="140" rx="8" ry="8" fill="#fdf2f8" stroke="#222" stroke-width="2"/>
<rect x="660" y="735" width="280" height="34" rx="8" ry="8" fill="#db2777" stroke="#222" stroke-width="0"/>
<text x="800.0" y="758" text-anchor="middle" class="box-title" fill="#fff">USB 麦克风</text>
